      if (!r) throw new Error('la partie n\'existe plus.');
      if (r.locked) throw new Error('la partie est verrouillée.');
      var taken = keys(r.players).some(function (u) { return u !== uid && norm(r.players[u].name) === norm(name); });
      if (taken) throw new Error('le pseudo « ' + name + ' » est déjà pris.');
      var me = { name: name, av: JOIN.av, score: 0, streak: 0, rank: 0 };
      if (r.settings && r.settings.team && JOIN.members.trim()) me.members = JOIN.members.trim().slice(0, 80);
      return DB.set('rooms/' + pin + '/players/' + uid, me);
    }).then(function () {
      var p = lsGet(K_PREFS, {}); p.av = JOIN.av; if (!(JOIN.room && JOIN.room.settings && JOIN.room.settings.nickGen)) p.name = name; lsSet(K_PREFS, p);
      notice(''); enterPlayer(pin);
    });
  }).catch(function (e) { notice('Impossible de rejoindre : ' + (e.code === 'PERMISSION_DENIED' ? 'partie fermée ou verrouillée.' : e.message), 'err'); });
};

function enterPlayer(pin) {
  if (H) exitHost(true);
  if (P) leavePlayer(true);
  lsSet(K_PLAYER, { pin: pin, uid: DB.uid });
  P = { pin: pin, room: null, key: '', qkey: '', sel: [], seq: [], val: null, me: null, gone: false };
  JOIN.step = 1; JOIN.room = null;
  show('game'); document.body.classList.add('in-game'); Snd.init(); Wake.on();
  $('v-game').innerHTML = '<div class="ph"><div class="ph-body"><div class="ph-big">Connexion…</div></div></div>';
  P.stop = DB.on('rooms/' + pin, function (r) { if (!P) return; P.room = r; renderPlayer(); }, function (e) { notice('Lecture de la partie refusée : ' + e.message, 'err'); });
  P.tick = setInterval(playerTick, 250);
}
function leavePlayer(silent) {
  if (!P) return;
  if (P.stop) P.stop(); clearInterval(P.tick); Wake.off(); P = null;
  if (!silent) show('home');
}
ACT['resume-player'] = function () { var pl = lsGet(K_PLAYER, null); if (pl && pl.pin) enterPlayer(pl.pin); };
ACT['drop-player'] = function () { lsDel(K_PLAYER); renderHome(); };
ACT['p-home'] = function () { lsDel(K_PLAYER); leavePlayer(); };
ACT['p-rejoin'] = function () { var pin = P ? P.pin : ''; leavePlayer(true); JOIN.pin = pin; JOIN.step = 1; show('join'); };

function sentKey() { return 'qa_sent_' + P.pin + '_' + (P.room ? P.room.qkey : ''); }
function isSent() { try { return !!sessionStorage.getItem(sentKey()); } catch (e) { return !!P.sentMem; } }
function setSent(v) { try { if (v) sessionStorage.setItem(sentKey(), '1'); else sessionStorage.removeItem(sentKey()); } catch (e) { P.sentMem = v; } }

function phTop(me) {
  return '<div class="ph-top"><div class="me">' + avatarHtml(me.av, 'sm') + '<span>' + esc(me.name) + '</span></div><span class="sc" id="pScore">' + (me.score || 0) + ' pts</span></div>';
}
function renderPlayer() {
  var r = P.room, uid = DB.uid, h;
  if (!r) {
    if (P.gone) return; P.gone = true;
    lsDel(K_PLAYER);
    var me0 = P.me;
    $('v-game').innerHTML = '<div class="ph"><div class="ph-body">' + badge('wave', 'yellow') + '<div class="ph-big">Partie terminée !</div>' +
      (me0 && me0.rank ? '<div class="ph-card">Tu termines <b>' + ordinal(me0.rank) + '</b> avec <b>' + (me0.score || 0) + ' points</b>.</div>' : '') +
      '<button class="btn yellow big" data-action="p-home">Retour à l\'accueil</button></div></div>';
    if (P.stop) P.stop(); clearInterval(P.tick);
    return;
  }
  var me = r.players && r.players[uid];
  if (!me) {
    var kicked = r.kicked && r.kicked[uid];
    if (P.key === 'out') return; P.key = 'out';
    if (kicked) lsDel(K_PLAYER);
    $('v-game').innerHTML = '<div class="ph"><div class="ph-body">' + badge(kicked ? 'door' : 'refresh', 'grey') + '<div class="ph-big">' + (kicked ? 'Le professeur t\'a retiré de la partie.' : 'Tu ne fais plus partie de la salle.') + '</div>' +
      (kicked ? '' : '<button class="btn yellow big" data-action="p-rejoin">Rejoindre à nouveau</button>') + '<button class="btn" data-action="p-home">Accueil</button></div></div>';
    return;
  }
  P.me = me;
  var sc = $('pScore'); if (sc) sc.textContent = (me.score || 0) + ' pts';
  if (r.qkey !== P.qkey) { P.qkey = r.qkey; P.sel = []; P.seq = []; P.val = null; }
  var late = r.status === 'reveal' || r.status === 'board' || r.status === 'podium';
  var key = r.status + '|' + r.qkey + '|' + (isSent() ? 1 : 0) + '|' + (late ? JSON.stringify(me.last || {}) + me.rank + me.score : me.name + me.av);
  if (key === P.key) return;
  var prevStatus = P.status; P.key = key; P.status = r.status;
  var st = r.settings || {}, q = r.q || {}, cls = 'ph', body = '';
  if (r.status === 'lobby') {
    body = avatarHtml(me.av, 'xxl bounce') + '<div class="ph-big">Tu es dans l\'arène !</div><div class="ph-card">Vois-tu <b>' + esc(me.name) + '</b> au tableau ?<br>La partie va commencer…</div>';
  } else if (r.status === 'intro') {
    body = '<div class="chip">Question ' + (r.index + 1) + ' / ' + r.total + '</div>' + tic(q.type, 'xxl') + '<div class="ph-big">' + TYPES[q.type].label + '</div>' +
      (st.showQ ? '<div class="ph-q">' + esc(q.text) + '</div>' : '<div style="font-weight:800">Regarde le tableau… prépare-toi !</div>') +
      (q.pts === 'double' ? '<div class="streak">' + ic('star') + ' Points doublés !</div>' : '');
  } else if (r.status === 'question') {
    if (isSent()) {
      var fun = ['Aussi rapide que l\'éclair !', 'Cerveau en ébullition…', 'Croisons les doigts !', 'Réponse en orbite !'];
      body = badge(['bolt', 'star', 'hourglass', 'rocket'][r.index % 4], ['yellow', 'blue', 'violet', 'green'][r.index % 4]) + '<div class="ph-big">Réponse envoyée !</div><div style="font-weight:800">' + fun[r.index % 4] + '<br>On attend les autres…</div>';
    } else body = questionUi(r, q, st);
  } else if (r.status === 'reveal') {
    var l = me.last && me.last.q === r.qkey ? me.last : { st: 'none', g: 0, n: 0 };
    var map = { ok: ['ok-bg', 'check', 'Bonne réponse !'], part: ['ok-bg', 'check', 'Presque ! Réponse partielle'], ko: ['ko-bg', 'close', 'Raté !'], none: ['none-bg', 'hourglass', 'Temps écoulé…'], poll: ['poll-bg', 'poll', 'Merci pour ton vote !'] }[l.st] || ['none-bg', 'hourglass', ''];
    cls += ' ' + map[0];
    body = badge(map[1], 'white') + '<div class="ph-big">' + map[2] + '</div>' +
      (l.st !== 'poll' ? '<div class="gain">+ ' + (l.g || 0) + '</div>' : '') +
      ((me.streak || 0) >= 2 ? '<div class="streak">' + ic('fire') + ' Série de ' + me.streak + ' !</div>' : '') +
      (l.st !== 'poll' ? '<div class="ph-card">' + rankLine(me, l) + '</div>' : '');
    if (prevStatus === 'question' || prevStatus === 'intro') { if (l.st === 'ok' || l.st === 'part') Snd.good(); else if (l.st === 'ko' || l.st === 'none') Snd.bad(); }
  } else if (r.status === 'board') {
    body = badge(me.rank === 1 ? 'crown' : me.rank <= 3 ? 'medal' : 'chart', me.rank === 1 ? 'yellow' : me.rank <= 3 ? 'blue' : 'violet') + '<div class="ph-big">Tu es ' + ordinal(me.rank || 0) + '</div><div class="ph-card">' + rankLine(me, me.last || {}) + '</div>';
  } else if (r.status === 'podium') {
    var rk = me.rank || 0;
    body = '<div class="rankmedal r' + (rk <= 3 ? rk : 0) + '">' + (rk <= 3 && rk ? rk : ic('star')) + '</div><div class="ph-big">' + (rk && rk <= 3 ? (rk === 1 ? '1re' : rk + 'e') + ' place !' : 'Tu termines ' + ordinal(rk)) + '</div><div class="ph-card">' + (me.score || 0) + ' points • bravo pour ta participation !</div>';
    if (rk && rk <= 3) setTimeout(function () { Confetti.run(4000); }, 4200);
  }
  $('v-game').innerHTML = '<div class="' + cls + '">' + phTop(me) + '<div class="ph-body">' + body + '</div></div>';
  playerTick();
}
function rankLine(me, l) {
  if (!me.rank) return '';
  if (me.rank === 1) return ic('crown') + ' Tu es en tête !' + (l.n ? ' (sur ' + l.n + ')' : '');
  return 'Tu es <b>' + ordinal(me.rank) + '</b>' + (l.ah ? (l.gap ? ', à <b>' + l.gap + ' pts</b> de ' + esc(l.ah) : ', à égalité avec ' + esc(l.ah)) : '');
}
function questionUi(r, q, st) {
  var h = '<div style="display:flex;justify-content:space-between;align-items:center;width:100%"><span class="chip">' + (r.index + 1) + ' / ' + r.total + ' • ' + TYPES[q.type].label + '</span><span class="ph-timer" id="pTimer">' + q.seconds + '</span></div>';
  if (st.showQ) h += '<div class="ph-q">' + esc(q.text) + '</div>' + (q.image ? '<img src="' + esc(q.image) + '" alt="" style="max-width:100%;max-height:22vh;border:3px solid var(--ink);border-radius:14px">' : '');
  var ch = arr(q.choices), i;
  if (q.type === 'single' || q.type === 'tf' || q.type === 'poll' || q.type === 'multi') {
    h += '<div class="ph-tiles' + (ch.length === 2 ? ' two' : '') + '">';
    for (i = 0; i < ch.length; i++) {
      h += '<button class="ph-tile c' + i + (has(P.sel, i) ? ' sel' : '') + '" data-action="p-pick" data-k="' + i + '" aria-label="' + esc(SHAPE_NAMES[i] + ' ' + COLOR_NAMES[i] + (st.showQ ? ' : ' + ch[i] : '')) + '">' + shape(i) + (st.showQ ? '<span>' + esc(ch[i]) + '</span>' : '') + '</button>';
    }
    h += '</div>';
    if (q.type === 'multi') h += '<button class="btn yellow big full" data-action="p-send-multi" id="pMulti"' + (P.sel.length ? '' : ' disabled') + '>Valider (' + P.sel.length + ')</button>';
  } else if (q.type === 'type') {
    h += '<div class="ph-card" style="display:grid;gap:12px"><label class="field">Ta réponse<input class="inp" id="pType" maxlength="60" autocomplete="off" autocapitalize="off" spellcheck="false" style="font-size:22px"></label><button class="btn pink big full" data-action="p-send-type">Envoyer ' + ic('next') + '</button></div>';
  } else if (q.type === 'slider') {
    var s = q.slider || { min: 0, max: 100, step: 1, unit: '' };
    if (P.val === null) P.val = Math.round(((s.min + s.max) / 2) / s.step) * s.step;
    h += '<div class="slider-in"><div class="val"><span id="pVal">' + fmtNum(P.val) + '</span> ' + esc(s.unit || '') + '</div>' +
      '<input type="range" id="pRange" min="' + s.min + '" max="' + s.max + '" step="' + s.step + '" value="' + P.val + '" data-input="p-range" aria-label="Valeur">' +
      '<div style="display:flex;justify-content:space-between;font-weight:900"><span>' + s.min + '</span><span>' + s.max + '</span></div>' +
      '<button class="btn yellow big full" data-action="p-send-slider">Valider ' + ic('next') + '</button></div>';
  } else if (q.type === 'puzzle') {
    var items = arr(q.items);
    h += '<p style="margin:0;font-weight:800">Touche les éléments dans le bon ordre</p><div class="puzzle-pick">';
    items.forEach(function (it, j) {
      var pos = P.seq.indexOf(it.k);
      h += '<button class="c' + (j % 4) + (pos !== -1 ? ' used' : '') + '" data-action="p-seq" data-k="' + it.k + '" style="color:' + (j % 4 === 2 ? 'var(--ink)' : '#fff') + '">' + shape(j) + '<span>' + esc(it.t) + '</span><span class="ord">' + (pos === -1 ? '' : pos + 1) + '</span></button>';
    });
    h += '</div><div style="display:flex;gap:10px;width:100%"><button class="btn" data-action="p-seq-reset">' + ic('refresh') + ' Effacer</button><button class="btn yellow full" data-action="p-send-puzzle"' + (P.seq.length === items.length ? '' : ' disabled') + '>Valider ' + ic('next') + '</button></div>';
  }
  return h;
}
function fmtNum(v) { return Math.round(v * 1000) / 1000; }
function playerTick() {
  if (!P || !P.room) return;
  var r = P.room, t = $('pTimer');
  if (r.status === 'question' && t) {
    var s = Math.max(0, Math.ceil((r.phaseEnd - DB.now()) / 1000));
    t.textContent = s; t.style.background = s <= 5 ? 'var(--pink)' : '';
  }
}
function pSend(c) {
  var r = P.room;
  if (!r || r.status !== 'question' || isSent()) return;
  var qkey = r.qkey;
  setSent(true); P.key = ''; renderPlayer();
  DB.set('answers/' + P.pin + '/' + qkey + '/' + DB.uid, { c: c, at: DB.TS }).catch(function (e) {
    if (!P) return;
    if (P.room && P.room.qkey === qkey) { setSent(false); P.key = ''; renderPlayer(); }
    toast(e && e.code === 'PERMISSION_DENIED' ? 'Trop tard : le temps est écoulé.' : 'Réponse non envoyée : ' + (e && e.message ? e.message : e));
  });
}
ACT['p-pick'] = function (el) {
  var k = Number(el.getAttribute('data-k')), q = P.room && P.room.q;
  if (!q) return;
  if (q.type !== 'multi') { el.classList.add('sel'); pSend(k); return; }
  P.sel = has(P.sel, k) ? P.sel.filter(function (x) { return x !== k; }) : P.sel.concat([k]);
  el.classList.toggle('sel', has(P.sel, k));
  var b = $('pMulti'); if (b) { b.disabled = !P.sel.length; b.textContent = 'Valider (' + P.sel.length + ')'; }
};
ACT['p-send-multi'] = function () { if (P.sel.length) pSend(P.sel.slice().sort()); };
ACT['p-send-type'] = function () {
  var v = String(($('pType') || {}).value || '').trim();
  if (!v) { toast('Écris ta réponse avant d\'envoyer.'); return; }
  pSend(v.slice(0, 60));
};
ACT['p-send-slider'] = function () { pSend(Number(P.val)); };
ACT['p-seq'] = function (el) {
  var k = el.getAttribute('data-k'), pos = P.seq.indexOf(k);
  if (pos === -1) P.seq.push(k); else P.seq = P.seq.slice(0, pos);
  P.key = ''; renderPlayer();
};
ACT['p-seq-reset'] = function () { P.seq = []; P.key = ''; renderPlayer(); };
ACT['p-send-puzzle'] = function () { var n = arr(P.room.q.items).length; if (P.seq.length === n) pSend(P.seq.slice()); };

/* ===================== 09 · DÉMARRAGE & ÉVÉNEMENTS ===================== */
function closestAttr(el, attr) {
  while (el && el !== document) { if (el.getAttribute && el.getAttribute(attr) !== null) return el; el = el.parentNode; }
  return null;
}
document.addEventListener('click', function (ev) {
  var a = closestAttr(ev.target, 'data-action');
  var n = closestAttr(ev.target, 'data-nav');
  if (a && n) { if (a.contains(n) && a !== n) a = null; else n = null; }
  if (a) {
    var name = a.getAttribute('data-action');
    if (ACT[name]) { if (a.tagName === 'A') ev.preventDefault(); ACT[name](a, ev); }
    return;
  }
  if (n) {
    var v = n.getAttribute('data-nav');
    if (v === 'library' && VIEW === 'editor' && ED) { ACT['ed-close'](); return; }
    if (v === 'join') { JOIN.step = 1; JOIN.room = null; }
    show(v);
  }
});
document.addEventListener('input', function (ev) {
  var el = ev.target;
  if (el.getAttribute('data-input') === 'lib-search') { libSearch(); return; }
  if (el.getAttribute('data-input') === 'p-range' && P) { P.val = Number(el.value); var v = $('pVal'); if (v) v.textContent = fmtNum(P.val); return; }
  if (el.hasAttribute('data-ed') || el.hasAttribute('data-ch') || el.hasAttribute('data-acc') || el.hasAttribute('data-it') || el.hasAttribute('data-sl')) edInput(el);
  if (el.id === 'jPin') { el.value = el.value.replace(/\D/g, '').slice(0, 6); }
});
document.addEventListener('change', function (ev) {
  var el = ev.target, c = el.getAttribute('data-change');
  if (c === 'import-json') importJson(el);
  else if (c === 'ed-image') edImage(el);
  else if (el.hasAttribute('data-ed')) { edInput(el); edChange(el); }
});
document.addEventListener('keydown', function (ev) {
  if (ev.key !== 'Enter') return;
  var id = ev.target && ev.target.id;
  if (id === 'jPin') ACT['join-check']();
  else if (id === 'jName' || id === 'jMembers') ACT['join-go']();
  else if (id === 'pType') ACT['p-send-type']();
});
window.addEventListener('resize', function () { var c = $('confetti'); if (c) { c.width = window.innerWidth; c.height = window.innerHeight; } });

function boot() {
  var icEls = document.querySelectorAll('[data-ic]');
  for (var k = 0; k < icEls.length; k++) icEls[k].innerHTML = ic(icEls[k].getAttribute('data-ic'));
  Store.load();
  var prefs = lsGet(K_PREFS, {});
  if (prefs.sound === false) Snd.on = false;
  initBackend();
  DB.onConn = refreshConn;
  refreshConn();
  var m = location.search.match(/[?&]pin=(\d{6})/), pl = lsGet(K_PLAYER, null);
  DB.ready.then(function (uid) {
    refreshConn();
    /* élève : retour automatique dans la partie après rechargement (même appareil, même identité) */
    if (pl && pl.pin && pl.uid === uid && (!m || m[1] === pl.pin) && !H && !P) { enterPlayer(pl.pin); return; }
    if (VIEW === 'home') renderHome();
  })
    .catch(function (e) { refreshConn(); notice(e && e.message ? e.message : String(e), 'err'); });
  if (m) { JOIN.pin = m[1]; JOIN.step = 1; show('join'); }
  else show('home');
  window.QuizArena = { version: VERSION, ic: ic, snd: Snd, avSvg: avSvg, avRandom: avRandom, backend: function () { return DB; }, parseQuick: parseQuick, scoreQuestion: scoreQuestion, norm: norm };
}
boot();

})();
</script>
