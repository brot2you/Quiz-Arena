<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#e60023">
<title>QUIZ ARENA • by BROT2YOU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@700;800;900&family=Nunito:wght@600;700;800;900;1000&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect x='6' y='6' width='88' height='88' rx='22' fill='%23e60023'/%3E%3Ctext x='50' y='70' font-size='56' text-anchor='middle'%3E%E2%9A%A1%3C/text%3E%3C/svg%3E">
<style>
/* QUIZ ARENA V3 — DA « console » : clair, arrondi, boutons qui s'enfoncent */
:root{
  --ink:#24262b;--ink2:#5d6270;--muted:#8b90a0;--line:#e4e6eb;--bg:#eef0f3;--card:#fff;--soft:#f6f7f9;
  --red:#e60023;--red-d:#b0001b;--blue:#2f7cf6;--blue-d:#1d58c4;--yellow:#ffc21a;--yellow-d:#d29a00;--green:#20bf78;--green-d:#14935a;
  --violet:#7a5cff;--violet-d:#5839d8;--orange:#ff8a1f;--orange-d:#d0650a;--cyan:#20c6e6;--pink:#ff4f8b;
  --a:#ef3346;--a-d:#b51d2d;--b:#2f7cf6;--b-d:#1d58c4;--c:#ffbd14;--c-d:#cf9000;--d:#22bd76;--d-d:#14905a;
  --sh:0 8px 24px rgba(24,28,44,.08),0 1px 3px rgba(24,28,44,.06);--sh-l:0 18px 40px rgba(24,28,44,.14);
  --r:22px;--display:'M PLUS Rounded 1c','Nunito',system-ui,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--ink);background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;font-weight:800;-webkit-tap-highlight-color:transparent}
button:disabled{opacity:.45;cursor:not-allowed}
.hide{display:none!important}
h1,h2,h3,.display{font-family:var(--display);font-weight:800;letter-spacing:-.3px;margin:0}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* ---------- Boutons « touche de manette » ---------- */
.btn{--bc:#fff;--bd:#d3d7df;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 22px;border-radius:999px;
  background:var(--bc);color:var(--ink);box-shadow:0 4px 0 var(--bd);font-size:16px;line-height:1.1;font-weight:800;
  transition:transform .08s,box-shadow .08s,filter .15s;text-decoration:none;position:relative;top:0}
.btn:hover:not(:disabled){filter:brightness(1.04)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.btn.pink,.btn.red{--bc:var(--red);--bd:var(--red-d);color:#fff}
.btn.blue{--bc:var(--blue);--bd:var(--blue-d);color:#fff}
.btn.yellow{--bc:var(--yellow);--bd:var(--yellow-d);color:#3a2b00}
.btn.green{--bc:var(--green);--bd:var(--green-d);color:#fff}
.btn.violet{--bc:var(--violet);--bd:var(--violet-d);color:#fff}
.btn.orange{--bc:var(--orange);--bd:var(--orange-d);color:#fff}
.btn.ink{--bc:var(--ink);--bd:#000;color:#fff}
.btn.big{font-size:20px;padding:16px 30px}.btn.full{width:100%}
.btn.sm{padding:8px 14px;font-size:14px;box-shadow:0 3px 0 var(--bd)}
.btn.ghost{background:transparent;box-shadow:none;color:var(--ink2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 13px;border-radius:999px;background:var(--soft);color:var(--ink2);font-weight:800;font-size:13px}
.chip.yellow{background:#fff3cc;color:#7a5800}.chip.pink{background:#ffe3e8;color:var(--red)}.chip.green{background:#dcf6ea;color:#0d7a49}.chip.blue{background:#e2edff;color:var(--blue-d)}
.sticker{display:inline-block;padding:5px 14px;border-radius:999px;background:#ffe3e8;color:var(--red);font-weight:900;font-size:12px;letter-spacing:1.2px;text-transform:uppercase}
.sticker.pink{background:var(--red);color:#fff}.sticker.blue{background:#e2edff;color:var(--blue-d)}.sticker.green{background:#dcf6ea;color:#0d7a49}

/* ---------- Coque ---------- */
.sidebar{position:fixed;inset:0 auto 0 0;width:240px;background:#fff;z-index:20;display:flex;flex-direction:column;padding:22px 14px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:12px;padding:0 8px 26px}
.logo-bolt{width:48px;height:48px;border-radius:15px;background:var(--red);display:grid;place-items:center;font-size:24px;box-shadow:0 4px 0 var(--red-d)}
.brand-txt{font-family:var(--display);font-weight:900;font-size:22px;line-height:.9;color:var(--ink)}
.brand-txt b{color:var(--red);font-weight:900}
.brand-txt small{display:block;font-family:Nunito;font-size:10px;letter-spacing:1.5px;color:var(--muted);margin-top:6px;font-weight:800}
.nav{display:grid;gap:6px}
.nav button{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;color:var(--ink2);font-size:16px;text-align:left}
.nav button .ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;font-size:17px;background:var(--soft)}
.nav button:hover{background:var(--soft)}
.nav button.active{background:#ffe9ec;color:var(--red)}
.nav button.active .ico{background:var(--red);color:#fff}
.side-foot{margin-top:auto;font-size:11px;color:var(--muted);display:grid;gap:6px;padding:8px;font-weight:700}
.app{margin-left:240px;min-height:100vh;display:flex;flex-direction:column}
.topbar{height:68px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 30px;background:rgba(238,240,243,.85);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}
.crumb{font-family:var(--display);font-size:19px;font-weight:800;color:var(--ink2)}
.top-actions{display:flex;gap:10px;align-items:center}
main{width:100%;max-width:1360px;margin:0 auto;padding:8px 30px 60px;flex:1}
footer.foot{text-align:center;color:var(--muted);font-size:12px;padding:18px 10px 90px;font-weight:700}
.status{margin:0 0 18px;padding:13px 18px;border-radius:18px;background:#fff6d6;font-weight:800;display:flex;justify-content:space-between;gap:10px;align-items:center;box-shadow:var(--sh)}
.status.err{background:#ffe3e8;color:#9b0018}.status.ok{background:#dcf6ea;color:#0d6a40}
.mode-banner{background:#e2edff;color:#163e8a;border-radius:18px;padding:14px 18px;margin-bottom:18px;font-weight:700}

/* ---------- Accueil ---------- */
.hero{position:relative;overflow:hidden;border-radius:32px;min-height:330px;background:#fff;box-shadow:var(--sh);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:44px 20px;gap:18px}
.hero:before{content:'';position:absolute;inset:auto 0 0 0;height:12px;background:linear-gradient(90deg,var(--a) 0 25%,var(--b) 25% 50%,var(--c) 50% 75%,var(--d) 75%)}
.hero-tiles{display:flex;gap:14px}
.hero-tiles span{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;animation:bob 2.4s ease-in-out infinite}
.hero-tiles span .shape{width:32px;height:32px}
.hero-tiles span:nth-child(2){animation-delay:.15s}.hero-tiles span:nth-child(3){animation-delay:.3s}.hero-tiles span:nth-child(4){animation-delay:.45s}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.hero-logo strong{display:block;font-family:var(--display);font-weight:900;font-size:clamp(52px,8vw,104px);line-height:.95;letter-spacing:-2px;color:var(--ink)}
.hero-logo strong em{font-style:normal;color:var(--red)}
.hero-logo .by{display:inline-block;margin-top:10px;color:var(--muted);font-weight:900;letter-spacing:3px;font-size:13px}
.hero p.tag{font-family:var(--display);font-size:20px;margin:0;font-weight:700;color:var(--ink2)}
.entry-grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:24px 0}
.entry{position:relative;border-radius:28px;padding:28px;box-shadow:var(--sh);display:flex;gap:22px;align-items:center;overflow:hidden;min-height:200px;color:#fff}
.entry.teacher{background:var(--red)}.entry.student{background:var(--blue)}
.entry .big-emoji{font-size:58px;width:108px;height:108px;flex:none;display:grid;place-items:center;background:rgba(255,255,255,.22);border-radius:30px}
.entry .sticker{background:rgba(255,255,255,.22);color:#fff}
.entry h2{font-size:32px;line-height:1.05;margin:10px 0 6px}
.entry p{margin:0 0 16px;font-weight:700;opacity:.92}
.entry .btn{--bc:#fff;--bd:rgba(0,0,0,.18);color:var(--ink)}
.features{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.feature{background:#fff;border-radius:20px;padding:14px 16px;box-shadow:var(--sh);display:flex;gap:12px;align-items:center;font-weight:800;font-size:14px;color:var(--ink2)}
.feature b{font-size:22px;width:44px;height:44px;flex:none;border-radius:14px;display:grid;place-items:center;background:var(--soft)}
.resume{background:#fff;border-radius:22px;padding:16px 20px;box-shadow:var(--sh);display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:18px;flex-wrap:wrap;font-weight:800;border-left:8px solid var(--yellow)}

/* ---------- En-têtes / bibliothèque ---------- */
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:10px 0 22px;flex-wrap:wrap}
.head h1{font-size:40px;line-height:1.05}
.head p{margin:6px 0 0;font-weight:700;color:var(--ink2)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;align-items:center}
.search{flex:1;min-width:220px;display:flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:0 18px;box-shadow:var(--sh)}
.search input{border:0;outline:0;padding:13px 0;width:100%;background:transparent;font-weight:700}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:20px}
.qcard{background:#fff;border-radius:24px;box-shadow:var(--sh);overflow:hidden;display:flex;flex-direction:column;transition:transform .15s,box-shadow .15s}
.qcard:hover{transform:translateY(-4px);box-shadow:var(--sh-l)}
.qcard .cover{height:112px;display:grid;place-items:center;font-size:48px;position:relative}
.qcard .cover .count{position:absolute;right:12px;bottom:12px;background:rgba(255,255,255,.9);color:var(--ink)}
.qcard:nth-child(4n+1) .cover{background:var(--a)}.qcard:nth-child(4n+2) .cover{background:var(--b)}.qcard:nth-child(4n+3) .cover{background:var(--c)}.qcard:nth-child(4n+4) .cover{background:var(--d)}
.qcard .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.qcard h3{font-size:20px;line-height:1.15;word-break:break-word}
.qcard p{margin:0;color:var(--ink2);font-weight:600;font-size:14px;flex:1}
.qcard .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.empty{grid-column:1/-1;text-align:center;background:#fff;border:3px dashed var(--line);border-radius:28px;padding:46px 20px}
.empty .e{font-size:60px}

/* ---------- Éditeur ---------- */
.creator{display:grid;grid-template-columns:210px minmax(0,1fr) 280px;gap:20px;align-items:start}
.creator-top{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:18px;background:#fff;border-radius:24px;padding:12px;box-shadow:var(--sh)}
.creator-top .title-in{flex:1;min-width:200px;font-family:var(--display);font-size:22px;font-weight:800;border:2px solid transparent;border-radius:16px;padding:9px 14px;background:var(--soft)}
.creator-top .title-in:focus{border-color:var(--blue);outline:0;background:#fff}
.slides{display:grid;grid-template-columns:minmax(0,1fr);gap:10px;max-height:calc(100vh - 210px);overflow:auto;padding:4px 6px 10px 2px;position:sticky;top:80px}
.slide{position:relative;min-width:0;width:100%;text-align:left;background:#fff;border-radius:18px;padding:11px 12px;box-shadow:var(--sh);font-size:13px;font-weight:800;min-height:76px;border:3px solid transparent}
.slide .n{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--ink2);font-size:12px;margin-right:6px}
.slide .t{display:block;margin-top:6px;color:var(--ink2);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slide .ty{font-size:11px;color:var(--muted)}
.slide.active{border-color:var(--red)}
.slide.active .n{background:var(--red);color:#fff}
.slide.bad:after{content:'!';position:absolute;right:-6px;top:-6px;width:22px;height:22px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-size:13px}
.qedit{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:22px;display:grid;gap:16px}
.qedit .qtext{width:100%;text-align:center;font-family:var(--display);font-size:23px;font-weight:800;border:2px solid transparent;border-radius:20px;padding:18px;background:var(--soft);resize:vertical;min-height:86px}
.qedit .qtext:focus{border-color:var(--blue);outline:0;background:#fff}
.media{border:2px dashed var(--line);border-radius:20px;padding:14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.media img{max-height:150px;max-width:260px;border-radius:14px}
.media input[type=url]{flex:1;min-width:180px}
.tiles-edit{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile-edit{display:flex;align-items:center;gap:10px;border-radius:20px;padding:10px 12px;color:#fff;min-height:70px}
.tile-edit input[type=text]{flex:1;min-width:0;border:0;background:rgba(255,255,255,.94);color:var(--ink);border-radius:12px;padding:11px;font-weight:800}
.tile-edit .ok{width:38px;height:38px;flex:none;border-radius:50%;background:rgba(255,255,255,.35);color:transparent;font-size:20px;display:grid;place-items:center;border:3px solid #fff}
.tile-edit .ok.on{background:#fff;color:var(--green)}
.c0{background:var(--a);box-shadow:0 5px 0 var(--a-d)}.c1{background:var(--b);box-shadow:0 5px 0 var(--b-d)}.c2{background:var(--c);box-shadow:0 5px 0 var(--c-d)}.c3{background:var(--d);box-shadow:0 5px 0 var(--d-d)}
.shape{width:30px;height:30px;flex:none;display:inline-block}
.field{display:grid;gap:6px;font-weight:800;font-size:14px;color:var(--ink2)}
.field input,.field select,.field textarea,.inp{border:2px solid var(--line);border-radius:14px;padding:11px 13px;background:#fff;font-weight:700;width:100%;color:var(--ink)}
.field input:focus,.field select:focus,.field textarea:focus,.inp:focus{border-color:var(--blue);outline:0}
.field small{font-weight:700;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.side-panel{background:#fff;border-radius:28px;box-shadow:var(--sh);padding:18px;display:grid;gap:14px;position:sticky;top:80px}
.type-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.type-btn{border-radius:16px;padding:10px 6px;background:var(--soft);font-size:12.5px;display:grid;gap:3px;place-items:center;text-align:center;color:var(--ink2);border:2px solid transparent}
.type-btn b{font-size:20px}
.type-btn.on{background:#ffe9ec;border-color:var(--red);color:var(--red)}
.seg{display:flex;background:var(--soft);border-radius:999px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 4px;font-size:13px;border-radius:999px;color:var(--ink2)}
.seg button.on{background:#fff;color:var(--red);box-shadow:0 2px 6px rgba(0,0,0,.1)}
.add-q{border:2px dashed #c9cdd6;border-radius:18px;padding:12px;font-size:15px;color:var(--ink2)}
.add-q:hover{border-color:var(--red);color:var(--red);background:#fff}
.hint{font-size:13px;color:var(--muted);font-weight:700;margin:0}
.puzzle-edit{display:grid;gap:10px}
.puzzle-edit .row{display:flex;gap:10px;align-items:center}
.puzzle-edit .row b{width:36px;height:36px;flex:none;display:grid;place-items:center;border-radius:12px;background:var(--yellow);color:#3a2b00}

/* ---------- Fenêtres ---------- */
.modal-back{position:fixed;inset:0;background:rgba(24,28,44,.5);backdrop-filter:blur(4px);z-index:100;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:#fff;border-radius:30px;box-shadow:var(--sh-l);width:min(620px,100%);padding:26px;display:grid;gap:14px;max-height:calc(100vh - 32px);overflow:auto;animation:pop-in .25s cubic-bezier(.3,1.4,.6,1)}
.modal h2{font-size:28px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mode{border-radius:22px;padding:16px;text-align:center;background:var(--soft);display:grid;gap:4px;border:3px solid transparent}
.mode b{font-size:40px}.mode span{font-family:var(--display);font-size:19px;font-weight:800}.mode small{font-weight:700;color:var(--muted)}
.mode.on{background:#ffe9ec;border-color:var(--red);color:var(--red)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;background:var(--soft);border-radius:18px;font-weight:800}
.opt small{display:block;font-weight:700;color:var(--muted);font-size:12px}
.switch{position:relative;width:54px;height:32px;flex:none;cursor:pointer}
.switch input{opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:20px;background:#cfd3db;transition:.18s}
.switch span:before{content:'';position:absolute;width:24px;height:24px;left:4px;top:4px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:.18s}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span:before{transform:translateX(22px)}

/* ---------- Rejoindre ---------- */
.join-card{max-width:500px;margin:10px auto;background:#fff;border-radius:32px;box-shadow:var(--sh);padding:28px;display:grid;gap:14px;text-align:center}
.join-card h1{font-size:36px}
.pin-in{text-align:center;font-family:var(--display);font-size:36px!important;letter-spacing:8px;font-weight:900;background:var(--soft)!important;border-color:transparent!important}
.nick-row{display:flex;gap:8px}
.avatars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.avatars button{font-size:24px;border-radius:14px;padding:4px;aspect-ratio:1;background:var(--soft);border:3px solid transparent}
.avatars button.on{border-color:var(--red);background:#ffe9ec}

/* ---------- Rapports ---------- */
.rep-list{display:grid;gap:12px}
.rep{background:#fff;border-radius:22px;box-shadow:var(--sh);padding:14px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.rep .meta{flex:1;min-width:200px}
.rep .meta b{font-family:var(--display);font-size:19px}
.rep .meta small{color:var(--muted);font-weight:700}
.pct{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-weight:900;flex:none;color:#fff}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th,.table td{padding:11px 12px;text-align:left;border-bottom:1px solid var(--line)}
.table th{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:1px}
.bar{height:12px;border-radius:8px;background:var(--soft);overflow:hidden;min-width:80px;margin-bottom:4px}
.bar i{display:block;height:100%;border-radius:8px}
.panel{background:#fff;border-radius:26px;box-shadow:var(--sh);padding:22px;margin-bottom:18px}
.panel h2{font-size:24px;margin-bottom:12px}
.scroll-x{overflow-x:auto}

/* ---------- SCÈNE DE JEU (projection + téléphones) ---------- */
body.in-game{background:#1c1f2b}
body.in-game .sidebar,body.in-game .topbar,body.in-game footer.foot,body.in-game .tabbar{display:none}
body.in-game .app{margin-left:0}
body.in-game main{max-width:none;padding:0}
.stage,.ph{background:radial-gradient(1200px 640px at 50% -10%,#3b4262 0%,#272b3d 50%,#1c1f2b 100%)}
.stage{min-height:100vh;color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.stage:after,.ph:after{content:'';position:absolute;inset:auto 0 0 0;height:8px;background:linear-gradient(90deg,var(--a) 0 25%,var(--b) 25% 50%,var(--c) 50% 75%,var(--d) 75%)}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 22px;position:relative;z-index:3;flex-wrap:wrap}
.stage-bar .left,.stage-bar .right{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:10px 24px 34px;position:relative;z-index:2;gap:20px;width:100%}
.stage .chip,.ph .chip{background:rgba(255,255,255,.12);color:#fff}
.stage .chip.yellow{background:#fff;color:var(--red)}
.stage .chip.pink{background:var(--red);color:#fff}
.floaters{display:none}
@keyframes pop-in{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes pulse{50%{opacity:.55}}

/* Salle d'attente */
.lobby-top{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:22px;width:min(1180px,100%);align-items:stretch}
.join-box{background:#fff;color:var(--ink);border-radius:32px;box-shadow:var(--sh-l);padding:24px 32px;display:flex;flex-direction:column;justify-content:center;gap:4px}
.join-box .url{font-weight:800;font-size:clamp(15px,1.6vw,22px);word-break:break-all;color:var(--ink2)}
.join-box .url span{color:var(--blue)!important}
.join-box .pin-label{font-weight:900;letter-spacing:3px;font-size:14px;margin-top:12px;color:var(--muted)}
.big-pin{font-family:var(--display);font-weight:900;font-size:clamp(70px,10vw,148px);line-height:.95;letter-spacing:6px;color:var(--ink)}
.qr-box{background:#fff;border-radius:32px;box-shadow:var(--sh-l);padding:16px;display:grid;place-items:center;color:var(--ink2);font-weight:800;font-size:13px;gap:4px}
.qr-box svg{width:clamp(150px,17vw,230px);height:auto;display:block}
.lobby-mid{display:flex;justify-content:space-between;align-items:center;width:min(1180px,100%);gap:12px;flex-wrap:wrap}
.counter{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:28px;font-weight:800}
.counter b{background:#fff;color:var(--red);border-radius:18px;padding:2px 18px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.names{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;width:min(1180px,100%);min-height:120px;align-content:flex-start}
.name-tag{display:inline-flex;gap:8px;align-items:center;background:#fff;color:var(--ink);border-radius:999px;padding:9px 18px;font-weight:900;font-size:clamp(16px,1.6vw,22px);box-shadow:0 4px 0 rgba(0,0,0,.15);animation:pop-in .3s cubic-bezier(.3,1.5,.6,1)}
.name-tag.host:hover{background:var(--red);color:#fff;text-decoration:line-through;cursor:pointer}
.wait-msg{font-family:var(--display);font-size:26px;font-weight:700;opacity:.9;animation:pulse 1.8s ease-in-out infinite}

/* Question */
.q-box{background:#fff;color:var(--ink);border-radius:28px;box-shadow:var(--sh-l);padding:22px 32px;text-align:center;width:min(1180px,100%);font-family:var(--display);font-weight:800;font-size:clamp(24px,3.3vw,48px);line-height:1.15}
.q-mid{display:grid;grid-template-columns:150px minmax(0,1fr) 150px;align-items:center;gap:20px;width:min(1180px,100%);flex:1;min-height:150px}
.q-mid img{max-width:100%;max-height:34vh;border-radius:24px;box-shadow:var(--sh-l);justify-self:center;background:#fff}
.q-mid .noimg{justify-self:center;font-size:96px;filter:drop-shadow(0 8px 12px rgba(0,0,0,.2))}
.timer-ring{width:124px;height:124px;border-radius:50%;background:#fff;color:var(--ink);box-shadow:0 6px 0 rgba(0,0,0,.18);display:grid;place-items:center;font-family:var(--display);font-size:54px;font-weight:900;justify-self:center}
.timer-ring.hurry{color:#fff;background:var(--red);animation:beat .5s infinite}
@keyframes beat{50%{transform:scale(1.07)}}
.ans-count{justify-self:center;text-align:center;font-family:var(--display);font-size:18px;font-weight:700}
.ans-count b{display:block;font-size:52px;line-height:1;font-weight:900}
.tbar{width:min(1180px,100%);height:14px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.tbar i{display:block;height:100%;background:var(--yellow);border-radius:999px;transform-origin:left;transition:transform .25s linear}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:18px;width:min(1180px,100%)}
.tile{display:flex;align-items:center;gap:16px;border-radius:24px;padding:18px 24px;min-height:96px;color:#fff;font-weight:900;font-size:clamp(18px,2.1vw,30px);text-align:left;line-height:1.15;position:relative;word-break:break-word}
.tile .shape{width:42px;height:42px}
.tile.dim{opacity:.3;filter:saturate(.4)}
.tile .mark{margin-left:auto;font-size:30px;background:#fff;color:var(--green);border-radius:50%;width:50px;height:50px;display:grid;place-items:center;flex:none}
.tile.c2{color:#3a2b00}
.intro-wrap{display:grid;gap:22px;place-items:center;text-align:center;width:min(1100px,100%)}
.intro-num{font-family:var(--display);font-size:22px;font-weight:800;opacity:.9}
.intro-type{animation:pop-in .35s;background:#fff!important;color:var(--red)!important;font-size:15px!important;padding:8px 18px!important}
.intro-bar{width:min(640px,90%);height:14px;border-radius:999px;background:rgba(255,255,255,.25);overflow:hidden}
.intro-bar i{display:block;height:100%;background:#fff;border-radius:999px;transform-origin:left}

/* Révélation */
.stats{display:flex;align-items:flex-end;justify-content:center;gap:18px;height:min(32vh,280px);width:min(860px,100%)}
.stat{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;max-width:170px}
.stat .col{width:100%;border-radius:16px 16px 6px 6px;min-height:48px;transition:height .7s cubic-bezier(.3,1.4,.6,1);display:grid;place-items:start center;padding-top:8px}
.stat .col .shape{width:28px;height:28px}
.stat .num{font-family:var(--display);font-size:32px;font-weight:900}
.stat.no .col{opacity:.35}
.reveal-answer{background:#fff;color:var(--green-d);border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.15);padding:14px 26px;font-family:var(--display);font-size:clamp(22px,2.8vw,38px);font-weight:800;text-align:center}
.word-list{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;width:min(1000px,100%)}
.word-list span{background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:8px 16px;font-weight:900;font-size:20px}
.word-list span.good{background:#fff;color:var(--green-d)}
.order-list{display:grid;gap:12px;width:min(780px,100%)}
.order-list div{display:flex;gap:12px;align-items:center;border-radius:20px;padding:12px 18px;font-weight:900;font-size:22px}
.slider-reveal{width:min(880px,100%);background:#fff;color:var(--ink);border-radius:28px;box-shadow:var(--sh-l);padding:26px}
.slider-track{position:relative;height:16px;border-radius:999px;background:var(--soft);margin:46px 10px 56px}
.slider-track .pin{position:absolute;top:50%;transform:translate(-50%,-50%);width:30px;height:30px;border-radius:50%;background:var(--red);border:5px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.slider-track .zone{position:absolute;top:0;bottom:0;background:var(--green);border-radius:999px;opacity:.55}
.slider-track .lbl{position:absolute;top:-40px;transform:translateX(-50%);font-weight:900;font-size:19px;white-space:nowrap}

/* Classement / podium */
.board{width:min(860px,100%);display:grid;gap:12px}
.board-row{display:flex;align-items:center;gap:14px;background:#fff;color:var(--ink);border-radius:22px;padding:12px 20px;box-shadow:0 5px 0 rgba(0,0,0,.14);font-weight:900;font-size:clamp(18px,2.1vw,27px);animation:slide-in .45s both}
.board-row .rk{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:14px;background:var(--soft);color:var(--ink2);font-size:21px}
.board-row:nth-child(1) .rk{background:var(--yellow);color:#3a2b00}.board-row:nth-child(2) .rk{background:#d5dbe5}.board-row:nth-child(3) .rk{background:#f2b27a;color:#5a2e00}
.board-row .av{font-size:28px}.board-row .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.board-row .delta{font-size:15px;color:var(--green);background:#dcf6ea;border-radius:999px;padding:3px 10px}
.board-row:nth-child(2){animation-delay:.08s}.board-row:nth-child(3){animation-delay:.16s}.board-row:nth-child(4){animation-delay:.24s}.board-row:nth-child(5){animation-delay:.32s}
@keyframes slide-in{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}
.title-pop{font-family:var(--display);font-weight:900;font-size:clamp(36px,5vw,66px);text-align:center;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.15)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:16px;width:min(860px,100%);height:min(54vh,450px)}
.pod{flex:1;max-width:250px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;opacity:0;transform:translateY(40px);transition:all .6s cubic-bezier(.3,1.5,.6,1)}
.pod.show{opacity:1;transform:none}
.pod .who{text-align:center;margin-bottom:10px;font-weight:900;font-size:clamp(18px,2.1vw,27px);word-break:break-word}
.pod .who .av{font-size:clamp(42px,5vw,62px);display:block}
.pod .who small{display:block;font-size:16px;opacity:.9}
.pod .block{width:100%;border-radius:22px 22px 0 0;display:grid;place-items:start center;padding-top:14px;font-family:var(--display);font-size:60px;font-weight:900;color:#fff;box-shadow:inset 0 -10px 0 rgba(0,0,0,.12)}
.pod.p1 .block{height:62%;background:var(--yellow);color:#7a5800}.pod.p2 .block{height:44%;background:#cdd5e2;color:#4b5568}.pod.p3 .block{height:30%;background:#f0a868;color:#6b3300}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:50}

/* Téléphone élève */
.ph{min-height:100vh;display:flex;flex-direction:column;color:#fff;position:relative}
.ph-top{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px;background:rgba(255,255,255,.06)}
.ph-top .me{display:flex;align-items:center;gap:8px;font-weight:900;font-size:16px;min-width:0}
.ph-top .me span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ph-top .sc{background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;font-weight:900;white-space:nowrap}
.ph-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 16px 26px;gap:16px;text-align:center}
.ph-q{background:#fff;color:var(--ink);border-radius:22px;padding:12px 14px;font-family:var(--display);font-size:19px;font-weight:800;width:100%}
.ph-tiles{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;flex:1;max-height:60vh;min-height:250px;padding-bottom:6px}
.ph-tiles.two{grid-template-columns:1fr}
.ph-tile{border-radius:26px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;font-weight:900;font-size:16px;padding:10px;transition:transform .08s,box-shadow .08s;word-break:break-word}
.ph-tile .shape{width:58px;height:58px}
.ph-tile:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.ph-tile.sel{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.2),inset 0 0 0 5px #fff}
.ph-tile.sel:after{content:'✓';font-size:28px}
.ph-tile.c2{color:#3a2b00}
.ph-big{font-family:var(--display);font-size:32px;font-weight:900;line-height:1.1}
.ph-emoji{font-size:86px;line-height:1;animation:pop-in .35s cubic-bezier(.3,1.5,.6,1)}
.ph-card{background:#fff;color:var(--ink);border-radius:22px;padding:16px;width:100%;font-weight:800}
.ph.ok-bg{background:var(--green)}.ph.ko-bg{background:var(--a)}.ph.poll-bg{background:var(--violet)}.ph.none-bg{background:#6b7386}
.gain{display:inline-block;background:rgba(0,0,0,.2);color:#fff;border-radius:999px;padding:8px 22px;font-family:var(--display);font-size:30px;font-weight:900}
.streak{display:inline-flex;gap:6px;align-items:center;background:#fff;color:var(--orange-d);border-radius:999px;padding:6px 14px;font-weight:900}
.ph-timer{width:56px;height:56px;border-radius:50%;background:#fff;color:var(--ink);display:grid;place-items:center;font-family:var(--display);font-size:24px;font-weight:900}
.puzzle-pick{display:grid;gap:12px;width:100%}
.puzzle-pick button{display:flex;gap:10px;align-items:center;border-radius:20px;padding:14px;color:#fff;font-weight:900;font-size:17px;text-align:left}
.puzzle-pick button .ord{margin-left:auto;width:38px;height:38px;border-radius:50%;background:rgba(255,255,255,.95);color:var(--ink);display:grid;place-items:center;font-size:19px;flex:none}
.puzzle-pick button.used{opacity:.5;transform:translateY(4px);box-shadow:none}
.slider-in{width:100%;display:grid;gap:14px}
.slider-in .val{font-family:var(--display);font-size:54px;font-weight:900}
input[type=range]{width:100%;accent-color:#fff;height:34px}

/* Barre d'onglets mobile */
.tabbar{display:none}
@media (max-width:1100px){
  .creator{grid-template-columns:1fr}
  .slides{position:static;display:flex;overflow-x:auto;max-height:none;padding-bottom:10px}
  .slide{min-width:150px;width:auto}
  .side-panel{position:static}
}
@media (max-width:860px){
  .sidebar{display:none}
  .app{margin-left:0}
  .topbar{height:58px;padding:0 14px}
  .crumb{font-size:16px}
  main{padding:8px 14px 40px}
  .tabbar{display:flex;align-items:flex-end;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:#fff;border-radius:28px;box-shadow:0 10px 30px rgba(24,28,44,.16),0 2px 6px rgba(24,28,44,.08);padding:8px 6px 7px}
  .tabbar button{flex:1;display:grid;justify-items:center;gap:3px;color:var(--muted);font-size:11px;font-weight:800;padding:0}
  .tabbar button b{width:46px;height:36px;border-radius:14px;display:grid;place-items:center;transition:background .15s,transform .1s}
  .tabbar button b .i{width:22px;height:22px}
  .tabbar button:active b{transform:scale(.92)}
  .tabbar button.active{color:var(--red)}
  .tabbar button.active b{background:#ffe9ec}
  .tabbar .tab-play b{width:62px;height:62px;border-radius:22px;margin-top:-30px;background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-d),0 8px 18px rgba(230,0,35,.35);transition:transform .08s,box-shadow .08s}
  .tabbar .tab-play b .i{width:32px;height:32px}
  .tabbar .tab-play:active b{transform:translateY(4px);box-shadow:0 1px 0 var(--red-d)}
  .tabbar .tab-play span{color:var(--red)}
  .tabbar .tab-play.active b{background:var(--red)}
  footer.foot{padding-bottom:120px}
  .entry-grid{grid-template-columns:1fr}
  .entry{flex-direction:column;text-align:center}
  .features{grid-template-columns:1fr 1fr}
  .head h1{font-size:32px}
  .tiles-edit{grid-template-columns:1fr}
  .lobby-top{grid-template-columns:1fr}
  .q-mid{grid-template-columns:1fr 1fr}
  .q-mid img,.q-mid .noimg{grid-column:1/-1;order:-1}
  .tiles{grid-template-columns:1fr}
  .modes{grid-template-columns:1fr}
  .avatars{grid-template-columns:repeat(6,1fr)}
  .grid3{grid-template-columns:1fr 1fr}
  .hero-tiles span{width:48px;height:48px;border-radius:14px}
}
@media (max-width:420px){.hero{min-height:260px}.features{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Icônes ---------- */
.i{width:1.15em;height:1.15em;flex:none;vertical-align:-.2em;display:inline-block}
.btn .i{width:1.2em;height:1.2em}
.logo-bolt .i{width:28px;height:28px;color:#fff;fill:#fff}
.nav button .ico .i{width:20px;height:20px}
.feature b{color:var(--ink2)}.feature b .i{width:24px;height:24px}
.feature:nth-child(4n+1) b{background:#ffe3e6;color:var(--a)}.feature:nth-child(4n+2) b{background:#e2edff;color:var(--b)}.feature:nth-child(4n+3) b{background:#fff3cc;color:#b07c00}.feature:nth-child(4n+4) b{background:#dcf6ea;color:var(--d-d)}
.entry .big-emoji .i{width:56px;height:56px;color:#fff}
.qcard .cover .i{width:52px;height:52px;color:#fff}
.qcard:nth-child(4n+3) .cover .i{color:#5a4100}
.empty .e .i{width:64px;height:64px;color:var(--muted)}
.media-ph .i{width:40px;height:40px;color:var(--muted)}
.status .i{width:18px;height:18px}
.tile-edit .ok .i{width:22px;height:22px}
.tile-edit .ok{color:transparent}.tile-edit .ok.on{color:var(--green)}
.mark .i{width:28px;height:28px;stroke-width:3}
.stat .num .i{width:26px;height:26px;stroke-width:3}
.field>span{display:inline-flex;align-items:center;gap:6px}
.tbadge{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:14px;color:#fff;flex:none;vertical-align:middle}
.tbadge .i{width:60%;height:60%}
.tbadge.sm{width:26px;height:26px;border-radius:9px}.tbadge.xs{width:20px;height:20px;border-radius:7px}
.tbadge.xl{width:76px;height:76px;border-radius:24px;box-shadow:0 6px 0 rgba(0,0,0,.18)}
.tbadge.xxl{width:120px;height:120px;border-radius:36px;box-shadow:0 8px 0 rgba(0,0,0,.2)}
.t-single{background:var(--a)}.t-multi{background:var(--b)}.t-tf{background:var(--c)}.t-type{background:var(--d)}.t-puzzle{background:var(--violet)}.t-slider{background:var(--orange)}.t-poll{background:var(--cyan)}
.t-tf .i{color:#5a4100}
.t-cloud{background:#4fa3ff}.t-open{background:var(--pink)}.t-pin{background:#e23d7a}.t-slide{background:#5d6270}
.qtypes{display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.type-btn .tbadge{width:34px;height:34px;border-radius:11px}
.type-btn.on .tbadge{box-shadow:0 0 0 3px #fff,0 0 0 5px var(--red)}
.slide .ty{display:inline-flex;align-items:center;gap:5px}
.bigbadge{display:grid;place-items:center;width:104px;height:104px;border-radius:34px;background:#fff;color:var(--ink);box-shadow:0 7px 0 rgba(0,0,0,.18);animation:pop-in .35s cubic-bezier(.3,1.5,.6,1)}
.bigbadge .i{width:58px;height:58px;stroke-width:2.4}
.bigbadge.mx{justify-self:center;width:84px;height:84px;border-radius:28px}.bigbadge.mx .i{width:46px;height:46px}
.bigbadge.blue{background:var(--blue);color:#fff;box-shadow:0 7px 0 var(--blue-d)}.bigbadge.yellow{background:var(--yellow);color:#5a4100;box-shadow:0 7px 0 var(--yellow-d)}
.bigbadge.violet{background:var(--violet);color:#fff;box-shadow:0 7px 0 var(--violet-d)}.bigbadge.green{background:var(--green);color:#fff;box-shadow:0 7px 0 var(--green-d)}
.bigbadge.grey{background:#4a5068;color:#fff}
.ok-bg .bigbadge.white{color:var(--green)}.ko-bg .bigbadge.white{color:var(--a)}.none-bg .bigbadge.white{color:#6b7386}.poll-bg .bigbadge.white{color:var(--violet)}
.rankmedal{width:118px;height:118px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:62px;font-weight:900;background:#fff;color:var(--ink);box-shadow:0 8px 0 rgba(0,0,0,.2),inset 0 0 0 8px rgba(0,0,0,.08);animation:pop-in .4s cubic-bezier(.3,1.5,.6,1)}
.rankmedal.r1{background:var(--yellow);color:#6b4b00}.rankmedal.r2{background:#d5dbe5;color:#4b5568}.rankmedal.r3{background:#f0a868;color:#6b3300}
.rankmedal .i{width:56px;height:56px;color:var(--yellow)}
.streak .i,.ph-card .i{width:1.1em;height:1.1em}
.title-pop .i{width:.9em;height:.9em;vertical-align:-.1em;color:var(--yellow)}
.reveal-answer .i{width:1em;height:1em;vertical-align:-.12em}
.slider-track .lbl .i{color:var(--red)}
.chip .i{width:1.05em;height:1.05em}
.join-box .url .i{width:1em;height:1em}
.qr-box span{display:inline-flex;gap:6px;align-items:center}

/* ---------- Avatars ---------- */
.avatar{display:inline-block;flex:none;border-radius:50%;overflow:hidden;line-height:0;vertical-align:middle}
.avatar svg{width:100%;height:100%;display:block}
.avatar.emoji{line-height:1;text-align:center;overflow:visible;border-radius:0}
.avatar.xs{width:28px;height:28px;margin-right:8px}.avatar.xs.emoji{font-size:20px}
.avatar.sm{width:34px;height:34px;box-shadow:0 0 0 3px rgba(255,255,255,.35)}.avatar.sm.emoji{font-size:26px}
.avatar.tag{width:34px;height:34px;margin:-4px 2px -4px -8px}.avatar.tag.emoji{font-size:24px;margin:0}
.avatar.md{width:46px;height:46px}.avatar.md.emoji{font-size:30px}
.avatar.pod{width:clamp(70px,8vw,104px);height:clamp(70px,8vw,104px);display:block;margin:0 auto 8px;box-shadow:0 6px 0 rgba(0,0,0,.18)}.avatar.pod.emoji{font-size:56px}
.avatar.xxl{width:140px;height:140px;box-shadow:0 8px 0 rgba(0,0,0,.14)}.avatar.xxl.emoji{font-size:90px;box-shadow:none}
.avatar.bounce{animation:pop-in .4s cubic-bezier(.3,1.5,.6,1),bob 2.4s ease-in-out .4s infinite}
.avatar.avopt{display:block;width:100%;height:auto;aspect-ratio:1/1}
.who-cell{display:inline-flex;align-items:center}
.avbuilder{display:grid;gap:12px;background:var(--soft);border-radius:24px;padding:14px}
.avprev{display:grid;justify-items:center;gap:10px}
.avprev .avatar{animation:pop-in .25s cubic-bezier(.3,1.5,.6,1)}
.avtabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.avtabs button{flex:none;padding:8px 13px;border-radius:999px;background:#fff;color:var(--ink2);font-size:13px;box-shadow:0 2px 0 #d3d7df}
.avtabs button.on{background:var(--red);color:#fff;box-shadow:0 2px 0 var(--red-d)}
.avopts{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.avopts button{background:#fff;border-radius:18px;padding:5px;border:3px solid transparent;box-shadow:0 3px 0 #d3d7df;display:block;width:100%;transition:transform .08s}
.avopts button:active{transform:translateY(2px);box-shadow:0 1px 0 #d3d7df}
.avopts button.on{border-color:var(--red)}
.swatch{display:block;width:100%;aspect-ratio:1;border-radius:50%}
.avatar.avopt.zoom{border-radius:14px}

/* ---------- Image dévoilée peu à peu ---------- */
.rv-wrap{position:relative;display:inline-block;justify-self:center;border-radius:24px;overflow:hidden;box-shadow:var(--sh-l);background:#fff;line-height:0}
.rv-wrap img{display:block;max-width:100%;max-height:34vh}
.rv-grid{position:absolute;inset:0;display:grid}
.rv-grid i{display:grid;place-items:center;transition:transform .45s cubic-bezier(.3,1.4,.6,1),opacity .45s;box-shadow:inset 0 0 0 1px rgba(255,255,255,.35)}
.rv-grid i .shape{width:34%;height:34%;opacity:.55}
.rv-grid i.off{transform:scale(0) rotate(30deg);opacity:0}
.rv-wrap.ph-img img{max-height:22vh}
.rv-wrap.ph-img{border-radius:16px}
.ph-img{max-width:100%;max-height:22vh;border-radius:16px}
img.reveal-full{max-height:26vh;max-width:min(560px,90%);border-radius:22px;box-shadow:var(--sh-l);background:#fff}
.rv-opt{width:100%;background:#fff}
.qedit>*{min-width:0}
.media{min-width:0}
.rv-opt{flex:1 1 100%;min-width:0}
.rv-opt>span:first-child{min-width:0;white-space:normal}

/* ---------- Épingle sur image (éditeur) ---------- */
.pin-edit{position:relative;display:inline-block;justify-self:center;cursor:crosshair;border-radius:18px;overflow:hidden;line-height:0;box-shadow:var(--sh);user-select:none;-webkit-user-select:none}
.pin-edit img{display:block;max-width:100%;max-height:52vh}
.pin-zone{position:absolute;aspect-ratio:1/1;border-radius:50%;transform:translate(-50%,-50%);background:rgba(34,189,118,.35);border:3px dashed #fff;box-shadow:0 0 0 2px rgba(0,0,0,.25);pointer-events:none}
.pin-dot{position:absolute;transform:translate(-50%,-100%);color:var(--red);pointer-events:none;line-height:0}
.pin-dot .i{width:34px;height:34px;fill:#fff;filter:drop-shadow(0 2px 2px rgba(0,0,0,.35))}

/* ---------- Diapo d'information ---------- */
.slide-card{background:#fff;color:var(--ink);border-radius:32px;box-shadow:var(--sh-l);padding:28px 36px;width:min(1100px,100%);display:grid;gap:18px;justify-items:center;text-align:center}
.slide-head{display:flex;gap:10px;align-items:center;color:var(--muted);font-weight:900;letter-spacing:1px}
.slide-card h2{font-size:clamp(28px,3.6vw,52px);line-height:1.1}
.slide-card img{max-width:100%;max-height:42vh;border-radius:20px}
.slide-body{font-size:clamp(18px,2vw,28px);font-weight:700;line-height:1.4;color:var(--ink2);max-width:900px;text-align:left}
.slide-ph{text-align:left;font-weight:700;line-height:1.4}

/* ---------- Nuage de mots ---------- */
.wcloud{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:6px 18px;width:min(1100px,100%);min-height:30vh;padding:20px;background:rgba(255,255,255,.06);border-radius:28px}
.wcloud span{font-family:var(--display);font-weight:900;line-height:1.1;animation:pop-in .45s cubic-bezier(.3,1.5,.6,1) both}
.wcloud sup{font-size:.4em;opacity:.7;margin-left:2px}
.wcloud .w0{color:#fff}.wcloud .w1{color:var(--yellow)}.wcloud .w2{color:#7fb8ff}.wcloud .w3{color:#ff8fa3}.wcloud .w4{color:#6fe3b0}.wcloud .w5{color:#c7b5ff}
.wcloud span:nth-child(2){animation-delay:.05s}.wcloud span:nth-child(3){animation-delay:.1s}.wcloud span:nth-child(4){animation-delay:.15s}.wcloud span:nth-child(n+5){animation-delay:.2s}
.rev-count{margin:0;font-weight:800;opacity:.85}

/* ---------- Question ouverte ---------- */
.open-wall{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;width:min(1180px,100%);max-height:52vh;overflow:auto;padding:4px}
.open-card{background:#fff;color:var(--ink);border-radius:18px;padding:14px 16px;font-weight:800;font-size:clamp(15px,1.4vw,20px);text-align:left;line-height:1.3;box-shadow:0 4px 0 rgba(0,0,0,.15);border-top:6px solid var(--a);animation:pop-in .35s both;word-break:break-word}
.open-card.o1{border-top-color:var(--b)}.open-card.o2{border-top-color:var(--c)}.open-card.o3{border-top-color:var(--d)}
.open-card.hidden-ans{opacity:.15;filter:blur(3px)}

/* ---------- Épingle : correction et téléphone ---------- */
.pin-reveal{position:relative;display:inline-block;line-height:0;border-radius:24px;overflow:hidden;box-shadow:var(--sh-l);background:#fff}
.pin-reveal img{display:block;max-width:min(900px,90vw);max-height:46vh}
.pin-mark{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.4);animation:pop-in .4s both}
.pin-mark.ok{background:var(--green)}.pin-mark.ko{background:var(--a)}
.pin-pad{position:relative;display:inline-block;line-height:0;border-radius:18px;overflow:hidden;cursor:crosshair;user-select:none;-webkit-user-select:none;touch-action:manipulation;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.pin-pad img{display:block;max-width:100%;max-height:46vh}
.field input[type=range]{accent-color:var(--red);border:0;padding:0;background:transparent;height:30px}
.pin-mark{width:24px;height:24px;border-width:4px}
/* ---- avatars illustrés ---- */
.avatar.avimg{position:relative;isolation:isolate}
.avimg .avin{position:absolute;inset:0;display:block}
.avimg .avin img{position:absolute;display:block;max-width:none;pointer-events:none;-webkit-user-select:none;user-select:none}
.avimg .avin.z-eyes{transform:scale(1.75);transform-origin:50% 47%}
.avimg .avin.z-face{transform:scale(1.6);transform-origin:50% 62%}
.avopts button small{display:block;font-size:10.5px;line-height:1.15;margin-top:4px;color:var(--ink2);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.avopts button .avatar.avopt{border-radius:50%}
.avnone{display:grid;place-items:center;width:100%;aspect-ratio:1/1;border-radius:50%;background:var(--soft);color:#9aa1ad}
.avnone .i{width:40%;height:40%}
.avtabs button{padding:8px 12px}
.avopts{grid-template-columns:repeat(4,minmax(0,1fr))}
.avopts button{min-width:0;padding:6px 5px 5px}
.avopts button .avatar.avopt{width:100%;height:auto;aspect-ratio:1/1}
@media (min-width:700px){.avopts{grid-template-columns:repeat(5,minmax(0,1fr))}}
.avatar.xs .avin,.avatar.sm .avin,.avatar.tag .avin,.avatar.md .avin{transform:scale(1.22);transform-origin:50% 42%}
.avatar.tag{width:42px;height:42px;margin:-7px 4px -7px -10px}

</style>
</head>

function defaultQuestion(type) {
  var q = {
    id: rid(8), type: type || 'single', text: '', image: '', seconds: 20, pts: 'standard',
    choices: ['', '', '', ''], correct: [0], accepted: ['', '', '', ''], items: ['', '', '', ''],
    slider: { min: 0, max: 100, step: 1, target: 50, tol: 5, unit: '' },
    body: '', pin: { x: 50, y: 50, r: 10 }, aspect: 1.5
  };
  if (q.type === 'tf') { q.choices = ['Vrai', 'Faux', '', '']; }
  if (NOSCORE[q.type]) { q.correct = []; }
  if (q.type === 'slide') q.seconds = 20;
  return q;
}

/* Normalise un quiz (V2 ou V3, import JSON) */
function migrateQuiz(src) {
  if (!src || typeof src !== 'object') return null;
  var quiz = {
    id: typeof src.id === 'string' && /^[\w-]{4,64}$/.test(src.id) ? src.id : rid(12),
    title: String(src.title || 'Quiz sans titre').slice(0, 120),
    description: String(src.description || '').slice(0, 400),
    questions: [], updated: src.updated || Date.now()
  };
  arr(src.questions).forEach(function (x) {
    if (!x || typeof x !== 'object') return;
    var type = TYPES[x.type] ? x.type : 'single';
    var q = defaultQuestion(type);
    q.id = typeof x.id === 'string' && /^[\w-]{2,40}$/.test(x.id) ? x.id : rid(8);
    q.text = String(x.text || '').slice(0, 240);
    q.image = typeof x.image === 'string' && (/^https:\/\//i.test(x.image) || /^data:image\/(jpeg|png|webp|gif);base64,/i.test(x.image)) ? x.image : '';
    q.reveal = !!(x.reveal && q.image);
    q.seconds = clamp(Number(x.seconds) || 20, 5, 240);
    if (x.pts === 'double' || x.pts === 'none' || x.pts === 'standard') q.pts = x.pts;
    else if (typeof x.points === 'number') q.pts = x.points <= 0 ? 'none' : (x.points >= 2000 ? 'double' : 'standard');
    var ch = arr(x.choices).map(function (c) { return String(c === null || c === undefined ? '' : c).slice(0, 120); });
    while (ch.length < 4) ch.push('');
    q.choices = ch.slice(0, 4);
    if (type === 'tf') { q.choices = ['Vrai', 'Faux', '', '']; }
    q.correct = arr(x.correct).map(Number).filter(function (n, i, a) { return n >= 0 && n < 4 && a.indexOf(n) === i; });
    if (NOSCORE[type]) q.correct = [];
    q.body = String(x.body || '').slice(0, 500);
    if (x.pin && typeof x.pin === 'object') q.pin = { x: clamp(Number(x.pin.x) || 0, 0, 100), y: clamp(Number(x.pin.y) || 0, 0, 100), r: clamp(Number(x.pin.r) || 10, 2, 40) };
    q.aspect = clamp(Number(x.aspect) || 1.5, 0.2, 5);
    var acc = arr(x.accepted).map(function (c) { return String(c || '').slice(0, 60); });
    while (acc.length < 4) acc.push('');
    q.accepted = acc.slice(0, 4);
    var it = arr(x.items).map(function (c) { return String(c || '').slice(0, 80); });
    while (it.length < 4) it.push('');
    q.items = it.slice(0, 4);
    if (x.slider && typeof x.slider === 'object') {
      q.slider = {
        min: Number(x.slider.min) || 0, max: Number(x.slider.max === undefined ? 100 : x.slider.max),
        step: Number(x.slider.step) || 1, target: Number(x.slider.target) || 0, tol: Math.abs(Number(x.slider.tol) || 0),
        unit: String(x.slider.unit || '').slice(0, 12)
      };
    }
    quiz.questions.push(q);
  });
  return quiz;
}

function filledChoices(q) {
  var n = q.type === 'tf' ? 2 : 4, out = [];
  for (var i = 0; i < n; i++) if (String(q.choices[i] || '').trim()) out.push(i);
  return out;
}

/* Renvoie un message d'erreur pour une question, ou null */
function questionError(q) {
  if (!String(q.text || '').trim()) return q.type === 'slide' ? 'Donne un titre à la diapo.' : 'Écris l\'énoncé de la question.';
  if (q.type === 'pin' && !q.image) return 'Ajoute une image : les élèves toucheront le bon endroit dessus.';
  if (q.image && !/^https:\/\//i.test(q.image) && !/^data:image\//i.test(q.image)) return 'L\'image doit être une adresse https:// ou un fichier importé.';
  if (q.type === 'single' || q.type === 'multi' || q.type === 'poll') {
    var f = filledChoices(q);
    if (f.length < 2) return 'Il faut au moins 2 réponses.';
    if (q.type !== 'poll') {
      var c = q.correct.filter(function (j) { return f.indexOf(j) !== -1; });
      if (!c.length) return 'Coche au moins une bonne réponse (non vide).';
      if (q.type === 'single' && c.length !== 1) return 'Une seule bonne réponse pour ce type (sinon choisis « Multi »).';
    }
  }
  if (q.type === 'tf' && q.correct.length !== 1) return 'Indique si c\'est Vrai ou Faux.';
  if (q.type === 'type' && !q.accepted.some(function (a) { return norm(a); })) return 'Ajoute au moins une réponse acceptée.';
  if (q.type === 'puzzle' && q.items.filter(function (a) { return String(a).trim(); }).length < 3) return 'Il faut au moins 3 éléments à remettre dans l\'ordre.';
  if (q.type === 'slider') {
    var s = q.slider;
    if (!(s.max > s.min)) return 'Le maximum doit être supérieur au minimum.';
    if (!(s.step > 0)) return 'Le pas doit être positif.';
    if (s.target < s.min || s.target > s.max) return 'La bonne valeur doit être entre le minimum et le maximum.';
    if ((s.max - s.min) / s.step > 2000) return 'Trop de valeurs possibles : augmente le pas.';
  }
  return null;
}
function quizErrors(quiz) {
  var errs = [];
  if (!String(quiz.title || '').trim()) errs.push({ i: -1, msg: 'Donne un titre au quiz.' });
  if (!quiz.questions.length) errs.push({ i: -1, msg: 'Ajoute au moins une question.' });
  quiz.questions.forEach(function (q, i) { var e = questionError(q); if (e) errs.push({ i: i, msg: e }); });
  return errs;
}

/* Version « partie » : réponses vides retirées, mélanges éventuels */
function buildPlayQuiz(quiz, opts) {
  var qs = quiz.questions.map(function (q) {
    var p = { type: q.type, text: q.text.trim(), image: q.image || '', reveal: !!(q.reveal && q.image), seconds: q.seconds, pts: q.pts };
    if (q.type === 'single' || q.type === 'multi' || q.type === 'poll' || q.type === 'tf') {
      var f = filledChoices(q);
      if (opts.shuffleA && q.type !== 'tf') f = shuffle(f);
      p.choices = f.map(function (j) { return String(q.choices[j]).trim(); });
      p.correct = [];
      f.forEach(function (j, k) { if (q.type !== 'poll' && q.correct.indexOf(j) !== -1) p.correct.push(k); });
    }
    if (q.type === 'type') p.accepted = q.accepted.filter(function (a) { return norm(a); }).map(function (a) { return a.trim(); });
    if (q.type === 'puzzle') {
      p.items = q.items.filter(function (a) { return String(a).trim(); }).map(function (a) { return a.trim(); });
      var ord = [], k;
      for (k = 0; k < p.items.length; k++) ord.push(k);
      var sh = shuffle(ord), guard = 0;
      while (sh.join() === ord.join() && guard++ < 10) sh = shuffle(ord);
      p.display = sh;
      p.tok = p.items.map(function () { return rid(6); });   /* jetons aléatoires : l'ordre correct n'est pas déductible côté élève */
    }
    if (q.type === 'slider') p.slider = clone(q.slider);
    if (q.type === 'pin') { p.pin = clone(q.pin); p.aspect = q.aspect; p.reveal = false; }
    if (q.type === 'slide') { p.body = String(q.body || '').trim(); p.pts = 'none'; }
    if (NOSCORE[q.type]) p.pts = 'none';
    return p;
  });
  if (opts.shuffleQ) {   /* les diapos restent à leur place */
    var slots = [], movable = [];
    qs.forEach(function (q, i) { if (q.type !== 'slide') { slots.push(i); movable.push(q); } });
    movable = shuffle(movable);
    slots.forEach(function (i, k) { qs[i] = movable[k]; });
  }
  return { title: quiz.title, quizId: quiz.id, questions: qs };
}

/* Partie visible par les élèves : jamais la bonne réponse */
function publicQuestion(q) {
  var p = { type: q.type, text: q.text, image: q.image || '', reveal: !!q.reveal, seconds: q.seconds, pts: q.pts };
  if (q.choices) p.choices = q.choices;
  if (q.type === 'puzzle') p.items = q.display.map(function (k) { return { k: q.tok[k], t: q.items[k] }; });
  if (q.type === 'slider') p.slider = { min: q.slider.min, max: q.slider.max, step: q.slider.step, unit: q.slider.unit };
  if (q.type === 'pin') { p.aspect = q.aspect; p.reveal = false; }   /* la cible reste secrète */
  if (q.type === 'slide') p.body = q.body || '';
  return p;
}

var Store = {
  quizzes: [],
  load: function () {
    var raw = lsGet(K_QUIZ, []);
    this.quizzes = arr(raw).map(migrateQuiz).filter(Boolean);
  },
  save: function () { return lsSet(K_QUIZ, this.quizzes); },
  get: function (id) { for (var i = 0; i < this.quizzes.length; i++) if (this.quizzes[i].id === id) return this.quizzes[i]; return null; },
  put: function (quiz) {
    quiz.updated = Date.now();
    for (var i = 0; i < this.quizzes.length; i++) if (this.quizzes[i].id === quiz.id) { this.quizzes[i] = clone(quiz); return this.save(); }
    this.quizzes.unshift(clone(quiz)); return this.save();
  },
  remove: function (id) { this.quizzes = this.quizzes.filter(function (q) { return q.id !== id; }); this.save(); },
  reports: function () { return arr(lsGet(K_REPORTS, [])); },
  saveReports: function (list) { return lsSet(K_REPORTS, list); }
};

function loadScript(src) {

    var s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = function () { rej(new Error('Impossible de charger ' + src)); };
    document.head.appendChild(s);
  });
}

  if (!t) { t = document.createElement('div'); t.id = 'toast'; t.setAttribute('role', 'status'); document.body.appendChild(t); t.style.cssText = 'position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:200;background:#fff;color:#1b0b3a;border:3px solid #1b0b3a;border-radius:14px;padding:12px 18px;font-weight:900;box-shadow:4px 4px 0 #1b0b3a;max-width:92vw;text-align:center'; }
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.style.display = 'none'; }, 4200);
}

function show(view) {
  if (view !== 'game') { document.body.classList.remove('in-game'); Confetti.stop(); }
  VIEW = view;
  ['home', 'library', 'editor', 'join', 'reports', 'game'].forEach(function (v) { $('v-' + v).classList.toggle('hide', v !== view); });
  var navView = view === 'editor' ? 'library' : view;
  var btns = document.querySelectorAll('[data-nav]');
  for (var i = 0; i < btns.length; i++) btns[i].classList.toggle('active', btns[i].getAttribute('data-nav') === navView);
  $('crumb').textContent = CRUMBS[view] || 'Quiz Arena';
  if (view !== 'game') notice('');
  if (view === 'home') renderHome();
  if (view === 'library') renderLibrary();
  if (view === 'join') renderJoin();
  if (view === 'reports') renderReports();
  window.scrollTo(0, 0);
}

function importJson(input) {
  var f = input.files && input.files[0]; if (!f) return;
  if (f.size > 15e6) { notice('Fichier trop volumineux (15 Mo max).', 'err'); input.value = ''; return; }
  var r = new FileReader();
  r.onload = function () {
    try {
      var obj = JSON.parse(r.result), list = Array.isArray(obj) ? obj : arr(obj.quizzes), n = 0;
      if (!list.length && obj.questions) list = [obj];
      list.forEach(function (raw) {
        var q = migrateQuiz(raw); if (!q || !q.questions.length) return;
        var existing = Store.get(q.id);
        if (existing && JSON.stringify(existing.questions) !== JSON.stringify(q.questions)) q.id = rid(12);
        Store.put(q); n++;
      });
      renderLibrary(); notice(n ? plural(n, 'quiz importé', 'quiz importés') + ' ✓' : 'Aucun quiz trouvé dans ce fichier.', n ? 'ok' : 'err');
    } catch (e) { notice('Import impossible : fichier JSON invalide.', 'err'); }
    input.value = '';
  };
  r.readAsText(f);
}

/* Import rapide : une question par ligne */
ACT['quick-import'] = function () {
  modal('<h2>' + ic('bolt') + ' Import rapide</h2><p class="hint">Une question par ligne. Sépare les éléments par <b>|</b>, <b>;</b> ou une tabulation (copier-coller depuis un tableur). Mets une <b>*</b> devant la ou les bonnes réponses.</p>' +
    '<pre style="background:#f5f0ff;border:3px solid #1b0b3a;border-radius:12px;padding:10px;white-space:pre-wrap;font-size:13px;margin:0">What is the capital of the UK? | *London | Paris | Dublin | Edinburgh\nLondon is in Scotland. | Vrai | *Faux\nWhich are colours? | *red | dog | *blue | run\nPast of "go"? | *went          → réponse à taper\nDo you like tea? | Yes | No | Sometimes   → sondage (pas d\'étoile)</pre>' +
    '<label class="field">Titre du quiz<input class="inp" id="qiTitle" placeholder="Ex. Unit 3 — Food"></label>' +
    '<label class="field">Questions<textarea class="inp" id="qiText" rows="9" placeholder="Colle tes questions ici…"></textarea></label>' +
    '<div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn" data-action="close-modal">Annuler</button><button class="btn pink" data-action="quick-import-go">Créer le quiz</button></div>');
};
function parseQuick(text) {
  var out = [];
  String(text || '').split(/\r?\n/).forEach(function (line) {
    if (!line.trim()) return;
    var sep = line.indexOf('\t') !== -1 ? '\t' : (line.indexOf('|') !== -1 ? '|' : ';');
    var parts = line.split(sep).map(function (s) { return s.trim(); }).filter(function (s) { return s !== ''; });
    if (parts.length < 2) return;
    var text0 = parts.shift(), stars = [], ch = parts.slice(0, 4).map(function (c, i) {
      if (c.charAt(0) === '*') { stars.push(i); return c.slice(1).trim(); }
      return c;
    });
    var q, low = ch.map(function (c) { return norm(c); }).join('|');
    if (ch.length === 1) { q = defaultQuestion('type'); q.accepted = [ch[0], '', '', '']; }
    else if (ch.length === 2 && (low === 'vrai|faux' || low === 'true|false')) { q = defaultQuestion('tf'); q.correct = [stars.length ? stars[0] : 0]; }
    else if (!stars.length) { q = defaultQuestion('poll'); q.choices = ch.concat(['', '', '', '']).slice(0, 4); }
    else { q = defaultQuestion(stars.length > 1 ? 'multi' : 'single'); q.choices = ch.concat(['', '', '', '']).slice(0, 4); q.correct = stars; }
    q.text = text0.slice(0, 240);
    out.push(q);
  });
  return out;
}
ACT['quick-import-go'] = function () {
  var qs = parseQuick($('qiText').value);
  if (!qs.length) { toast('Aucune question reconnue : vérifie les séparateurs.'); return; }
  var quiz = { id: rid(12), title: ($('qiTitle').value || 'Quiz importé').slice(0, 120), description: '', questions: qs };
  Store.put(quiz); closeModal(); openEditor(clone(quiz));
  notice(plural(qs.length, 'question importée', 'questions importées') + '. Vérifie-les puis lance la partie !', 'ok');
};

/* ---------- RAPPORTS ---------- */
var openReport = null;
function reportStats(rep) {
  var pids = keys(rep.players), qs = rep.questions || [], perQ = [], tot = 0, okTot = 0;
  qs.forEach(function (q, i) {
    var res = (rep.results || [])[i] || {}, ok = 0, n = 0, time = 0, tn = 0;
    pids.forEach(function (u) { var r = res[u]; if (NOSCORE[q.type]) return; n++; if (r && r.st === 'ok') ok++; if (r && r.t >= 0 && r.st !== 'none') { time += r.t; tn++; } });
    perQ.push({ q: q, pct: n ? Math.round(ok * 100 / n) : null, ok: ok, n: n, avg: tn ? Math.round(time / tn / 100) / 10 : null });
    if (!NOSCORE[q.type]) { tot += n; okTot += ok; }
  });
  return { perQ: perQ, pct: tot ? Math.round(okTot * 100 / tot) : null, players: pids.length };
}
function pctColor(p) { return p === null ? '#ddd' : p >= 70 ? 'var(--green)' : p >= 40 ? 'var(--orange)' : 'var(--red)'; }
function renderReports() {
  var list = Store.reports().sort(function (a, b) { return b.date - a.date; }), h;
  if (openReport) { var rep = list.filter(function (r) { return r.id === openReport; })[0]; if (rep) { $('v-reports').innerHTML = reportDetail(rep); return; } openReport = null; }
  h = '<div class="head"><div><span class="sticker green">Après la partie</span><h1 style="margin-top:10px">Rapports</h1><p>Réussite par question et par élève, export pour ton tableur.</p></div></div><div class="rep-list">';
  if (!list.length) h += '<div class="empty"><div class="e">' + ic('chart') + '</div><h2>Pas encore de rapport</h2><p>Chaque partie terminée apparaît ici automatiquement.</p></div>';
  list.forEach(function (r) {
    var s = reportStats(r);
    h += '<div class="rep"><div class="pct" style="background:' + pctColor(s.pct) + '">' + (s.pct === null ? '—' : s.pct + '%') + '</div><div class="meta"><b>' + esc(r.title) + '</b><br><small>' + fmtDate(r.date) + ' • ' + plural(s.players, r.team ? 'équipe' : 'joueur') + ' • ' + plural((r.questions || []).length, 'question') + '</small></div>' +
      '<button class="btn sm violet" data-action="open-report" data-id="' + esc(r.id) + '">Voir</button><button class="btn sm" data-action="csv-report" data-id="' + esc(r.id) + '">' + ic('download') + ' CSV</button><button class="btn sm" data-action="del-report" data-id="' + esc(r.id) + '" aria-label="Supprimer">' + ic('trash') + '</button></div>';
  });
  $('v-reports').innerHTML = h + '</div>';
}
function reportDetail(rep) {
  var s = reportStats(rep), pids = keys(rep.players);

    '<button class="btn green" data-action="csv-report" data-id="' + esc(rep.id) + '">' + ic('download') + ' Exporter CSV détaillé</button></div>';
  var hard = s.perQ.filter(function (x) { return x.pct !== null && x.pct < 50; });
  if (hard.length) h += '<div class="panel" style="background:#ffe1ec"><h2>' + ic('warn') + ' À retravailler</h2>' + hard.map(function (x) { return '<div style="font-weight:800;margin:6px 0">' + esc(x.q.text) + ' — ' + x.pct + ' % de réussite</div>'; }).join('') + '</div>';
  h += '<div class="panel"><h2>Questions</h2><div class="scroll-x"><table class="table"><tr><th>#</th><th>Question</th><th>Type</th><th>Réussite</th><th>Temps moyen</th></tr>';
  s.perQ.forEach(function (x, i) {

      (x.pct === null ? (x.q.type === 'slide' ? 'diapo' : 'sans points') : '<div class="bar"><i style="width:' + x.pct + '%;background:' + pctColor(x.pct) + '"></i></div>' + x.pct + ' % (' + x.ok + '/' + x.n + ')') + '</td><td>' + (x.avg === null ? '—' : x.avg + ' s') + '</td></tr>';
  });
  h += '</table></div></div><div class="panel"><h2>' + (rep.team ? 'Équipes' : 'Élèves') + '</h2><div class="scroll-x"><table class="table"><tr><th>Rang</th><th>Pseudo</th><th>Score</th><th>Bonnes réponses</th><th>Sans réponse</th></tr>';
  pids.forEach(function (u, i) {
    var p = rep.players[u], ok = 0, n = 0, none = 0;
    (rep.questions || []).forEach(function (q, qi) { if (NOSCORE[q.type]) return; n++; var r = ((rep.results || [])[qi] || {})[u]; if (r && r.st === 'ok') ok++; if (!r || r.st === 'none') none++; });
    h += '<tr><td>' + (i + 1) + '</td><td><span class="who-cell">' + avatarHtml(p.av, 'xs') + esc(p.name) + '</span>' + (p.members ? '<br><small>' + esc(p.members) + '</small>' : '') + '</td><td><b>' + (p.score || 0) + '</b></td><td>' + ok + '/' + n + '</td><td>' + none + '</td></tr>';
  });
  h += '</table></div></div>';
  /* réponses écrites (questions ouvertes et nuages de mots) */
  (rep.questions || []).forEach(function (q, qi) {
    if (q.type !== 'open' && q.type !== 'cloud') return;
    var res = (rep.results || [])[qi] || {}, rows = '';
    pids.forEach(function (u) { var r = res[u]; if (r && r.a) rows += '<tr><td>' + esc(rep.players[u].name) + '</td><td>' + esc(r.a) + '</td></tr>'; });
    h += '<div class="panel"><h2>' + tic(q.type, 'sm') + ' ' + esc(q.text) + '</h2>' + (rows ? '<div class="scroll-x"><table class="table"><tr><th>Pseudo</th><th>Réponse</th></tr>' + rows + '</table></div>' : '<p class="hint">Aucune réponse.</p>') + '</div>';
  });
  return h;
}
function reportCsv(rep) {
  var qs = rep.questions || [], pids = keys(rep.players);
  pids.sort(function (a, b) { return (rep.players[b].score || 0) - (rep.players[a].score || 0); });
  var head = ['Rang', 'Pseudo', 'Membres', 'Score total', 'Bonnes réponses'];
  qs.forEach(function (q, i) { head.push('Q' + (i + 1) + ' réponse', 'Q' + (i + 1) + ' résultat', 'Q' + (i + 1) + ' points', 'Q' + (i + 1) + ' temps (s)'); });
  var lines = [csvLine(['Quiz', rep.title, 'Date', fmtDate(rep.date)]), csvLine(head)];
  pids.forEach(function (u, i) {
    var p = rep.players[u], ok = 0, row = [i + 1, p.name, p.members || '', p.score || 0, ''];
    qs.forEach(function (q, qi) {
      var r = ((rep.results || [])[qi] || {})[u] || { st: 'none' };
      if (r.st === 'ok') ok++;
      row.push(r.a || '', { ok: 'juste', part: 'partiel', ko: 'faux', none: 'sans réponse', poll: 'réponse' }[r.st] || '', r.g || 0, r.t >= 0 && r.st !== 'none' ? (r.t / 1000).toFixed(1) : '');
    });
    row[4] = ok; lines.push(csvLine(row));
  });
  lines.push('');
  lines.push(csvLine(['Question', 'Type', 'Réussite (%)']));
  reportStats(rep).perQ.forEach(function (x, i) { lines.push(csvLine([(i + 1) + '. ' + x.q.text, TYPES[x.q.type].label, x.pct === null ? '' : x.pct])); });
  return '﻿' + lines.join('\r\n');
}

/* Saisie au clavier : on met à jour le modèle sans tout redessiner (le curseur reste en place) */
function edInput(el) {
  if (!ED) return;
  var q = cur(), f = el.getAttribute('data-ed');
  if (f === 'title') ED.title = el.value;
  else if (f === 'text') { q.text = el.value; var t = $('slideT' + EDSEL); if (t) t.textContent = el.value || 'Question vide'; }
  else if (f === 'image') { q.image = el.value.trim(); }
  else if (f === 'seconds') q.seconds = Number(el.value) || 20;
  else if (f === 'reveal') q.reveal = !!el.checked;
  else if (f === 'body') q.body = el.value;
  else if (f === 'pinr') { q.pin.r = Number(el.value) || 10; var z = document.querySelector('.pin-zone'); if (z) z.style.width = (q.pin.r * 2) + '%'; }
  else if (el.hasAttribute('data-ch')) q.choices[Number(el.getAttribute('data-ch'))] = el.value;
  else if (el.hasAttribute('data-acc')) q.accepted[Number(el.getAttribute('data-acc'))] = el.value;
  else if (el.hasAttribute('data-it')) q.items[Number(el.getAttribute('data-it'))] = el.value;
  else if (el.hasAttribute('data-sl')) { var k = el.getAttribute('data-sl'); q.slider[k] = k === 'unit' ? el.value : Number(el.value); }
  else if (f === 'desc') ED.description = el.value;
  refreshErr(); saveDraft();
}
function edChange(el) { if (el.getAttribute('data-ed') === 'image') edRedraw(); }

ACT['ed-sel'] = function (el) { EDSEL = Number(el.getAttribute('data-i')); edRedraw(); };
ACT['ed-add'] = function () {

  if (prev) { q.seconds = prev.seconds; q.pts = prev.pts; }

ACT['ed-del'] = function () {

  ED.questions.splice(EDSEL, 1); EDSEL = Math.max(0, EDSEL - 1); edRedraw();
};
ACT['ed-move'] = function (el) {
  var d = Number(el.getAttribute('data-d')), j = EDSEL + d;
  if (j < 0 || j >= ED.questions.length) return;
  var t = ED.questions[EDSEL]; ED.questions[EDSEL] = ED.questions[j]; ED.questions[j] = t; EDSEL = j; edRedraw();

ACT['ed-type'] = function (el) {
  var q = cur(), t = el.getAttribute('data-t'), old = q.type;
  if (t === old) return;
  q.type = t;
  if (t === 'tf') { q.choices = ['Vrai', 'Faux', '', '']; q.correct = [0]; }
  else if (old === 'tf') { q.choices = ['', '', '', '']; q.correct = [0]; }
  if (t === 'single') q.correct = q.correct.length ? [q.correct[0]] : [0];
  if (t === 'multi' && !q.correct.length) q.correct = [0];
  if (NOSCORE[t]) q.correct = [];
  if (NOSCORE[old] && !NOSCORE[t] && !q.correct.length) q.correct = [0];
  if (NOSCORE[t]) q.pts = 'standard';
  if (t === 'pin' || t === 'slide') q.reveal = false;
  edRedraw();
};
ACT['ed-pin'] = function (el, ev) {
  var img = el.querySelector('img'); if (!img) return;
  var r = img.getBoundingClientRect(), q = cur();
  if (!r.width || !r.height) return;
  q.pin.x = Math.round(clamp((ev.clientX - r.left) / r.width * 100, 0, 100) * 10) / 10;
  q.pin.y = Math.round(clamp((ev.clientY - r.top) / r.height * 100, 0, 100) * 10) / 10;
  if (img.naturalWidth && img.naturalHeight) q.aspect = img.naturalWidth / img.naturalHeight;
  var z = el.querySelector('.pin-zone'), d = el.querySelector('.pin-dot');
  if (z) { z.style.left = q.pin.x + '%'; z.style.top = q.pin.y + '%'; }
  if (d) { d.style.left = q.pin.x + '%'; d.style.top = q.pin.y + '%'; }
  saveDraft();
};
ACT['ed-pts'] = function (el) { cur().pts = el.getAttribute('data-p'); edRedraw(); };
ACT['ed-correct'] = function (el) {
  var q = cur(), j = Number(el.getAttribute('data-j'));
  if (q.type === 'multi') q.correct = has(q.correct, j) ? q.correct.filter(function (x) { return x !== j; }) : q.correct.concat([j]).sort();
  else q.correct = [j];
  edRedraw();

ACT['ed-noimg'] = function () { cur().image = ''; cur().reveal = false; edRedraw(); };
function edImage(input) {
  var f = input.files && input.files[0]; if (!f) return;
  if (!/^image\//.test(f.type)) { notice('Ce fichier n\'est pas une image.', 'err'); return; }
  var r = new FileReader();
  r.onload = function () {
    var img = new Image();
    img.onload = function () {
      var max = 900, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      var ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(img, 0, 0, c.width, c.height);
      var qual = 0.78, data = c.toDataURL('image/jpeg', qual);
      while (data.length > 160000 && qual > 0.35) { qual -= 0.1; data = c.toDataURL('image/jpeg', qual); }
      cur().image = data; cur().aspect = c.width / c.height; edRedraw();
    };
    img.onerror = function () { notice('Image illisible.', 'err'); };
    img.src = r.result;
  };
  r.readAsDataURL(f);
  input.value = '';
}

function createGame(id, o) {
  var quiz = Store.get(id); if (!quiz) return;
  var play = buildPlayQuiz(quiz, o), uid;
  notice('Ouverture de la salle…');
  DB.ready.then(function (u) {

/* ---------- Déroulé ---------- */
function goIntro(i) {
  var q = H.quiz.questions[i];
  if (q.type === 'slide') return step({ status: 'slide', index: i, qkey: 'q' + i, phaseEnd: 0, introMs: 0, q: publicQuestion(q), rev: null, top: null, startedAt: 0 });
  var ms = clamp(2600 + q.text.length * 45, 3500, 7000);
  return step({ status: 'intro', index: i, qkey: 'q' + i, phaseEnd: DB.now() + ms, introMs: ms, q: publicQuestion(q), rev: null, top: null, startedAt: 0 });
}
function goQuestion() {
  var q = curQ(), start = DB.now();
  return step({ status: 'question', startedAt: start, phaseEnd: start + q.seconds * 1000 });
}
function nextFrom() {
  var r = H.room;
  if (r.status === 'lobby') return goIntro(0);
  if (r.status === 'intro') return goQuestion();
  if (r.status === 'question') return doReveal();
  if (r.status === 'slide') { if (r.index + 1 >= r.total) return goPodium(); return goIntro(r.index + 1); }
  if (r.status === 'reveal') { if (NOSCORE[curQ().type] && r.index + 1 < r.total) return goIntro(r.index + 1); return step({ status: 'board' }); }
  if (r.status === 'board') { if (r.index + 1 >= r.total) return goPodium(); return goIntro(r.index + 1); }
}
function doReveal() {
  if (!H || H.busy || H.room.status !== 'question') return;
  H.busy = true;
  var r = H.room, qi = r.index, qkey = r.qkey, q = curQ();
  DB.get('answers/' + H.pin + '/' + qkey).then(function (ans) {
    if (!H || H.room.qkey !== qkey || H.room.status !== 'question') { if (H) H.busy = false; return; }
    var out = scoreQuestion(q, ans || {}, H.room);
    /* rapport local */
    var ps = H.room.players || {};
    keys(ps).forEach(function (u) {
      H.rep.players[u] = { name: ps[u].name, av: ps[u].av || '', members: ps[u].members || '', score: out.scores[u] };
    });
    H.rep.results[qi] = out.results;
    lsSet(K_HOSTREP + H.pin, H.rep);
    return DB.update('rooms/' + H.pin, out.upd).then(function () { if (H) H.busy = false; });
  }).catch(function (e) { if (H) H.busy = false; notice('Erreur pendant la correction : ' + e.message, 'err'); });
}
/* Barème Kahoot : points × (1 − temps/durée ÷ 2), bonus de série jusqu'à +500 */
function scoreQuestion(q, ans, room) {

  if (NOSCORE[q.type]) base = 0;
